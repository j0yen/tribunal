[package]
name = "tribunal-corpus"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent ethics evaluation corpus and validator for ousia-guard"
license = "MIT"

[[bin]]
name = "tribunal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
