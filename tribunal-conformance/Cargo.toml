[package]
name = "tribunal-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "tribunal_conformance"
path = "src/lib.rs"

[[bin]]
name = "tribunal"
path = "src/main.rs"

[dependencies]
horned-owl = "0.14"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigpipe = "0.1"
toml = "0.8"
