[package]
name = "tribunal-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "tribunal_bench"
path = "src/lib.rs"

[[bin]]
name = "tribunal-bench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sigpipe = "0.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
